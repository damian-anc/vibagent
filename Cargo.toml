[package]
name = "vibagent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
async-stream = "0.3.6"
async-trait = "0.1.89"
dotenv = "0.15.0"
futures = "0.3.31"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
urlencoding = "2.1.3"
